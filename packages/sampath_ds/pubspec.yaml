name: sampath_ds
description: "Sampath Bank mobile design system: tokens, icons and components."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  iconoir_flutter: 7.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/icons/brand/
    - assets/icons/partner/

  fonts:
    - family: Hanken Grotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk-Bold.ttf
          weight: 700
        - asset: assets/fonts/HankenGrotesk-ExtraBold.ttf
          weight: 800
    - family: Noto Sans Sinhala
      fonts:
        - asset: assets/fonts/NotoSansSinhala-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSinhala-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSinhala-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansSinhala-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansSinhala-ExtraBold.ttf
          weight: 800
    - family: Noto Sans Tamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansTamil-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansTamil-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansTamil-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansTamil-ExtraBold.ttf
          weight: 800
